<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Sederhana</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 500px;
            margin: 50px auto;
            text-align: center;
        }

        input {
            padding: 10px;
            width: 70%;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
            text-align: left;
        }

        li {
            background: #f4f4f4;
            padding: 10px;
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
        }

        .hapus {
            color: red;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Daftar Tugasku</h1>
    <input type="text" id="input-tugas" placeholder="Mau ngapain hari ini?">
    <button id="btn-tambah">Tambah</button>

    <ul id="daftar-tugas">
        <!-- Tugas akan muncul di sini -->
    </ul>

    <script src="script.js"></script>
</body>

</html>
